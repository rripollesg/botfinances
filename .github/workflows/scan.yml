name: Escaneo de mercado

on:
  schedule:
    # Cada 15 minutos (UTC)
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de ejecución"
        required: true
        default: "scan"
        type: choice
        options:
          - scan
          - test-telegram
          - backtest

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FUENTE_DATOS: yfinance
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            MODE="scan"
          fi

          if [ "$MODE" = "scan" ]; then
            python bot.py
          elif [ "$MODE" = "test-telegram" ]; then
            python bot.py test-telegram
          elif [ "$MODE" = "backtest" ]; then
            python bot.py backtest
          else
            echo "Modo no soportado: $MODE"
            exit 1
          fi
